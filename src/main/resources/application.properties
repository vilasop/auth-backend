# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────
# MySQL DataSource
# Credentials are read from environment variables.
# For local development, set DB_USERNAME and DB_PASSWORD
# in your shell or IDE run configuration.
#
# Example (PowerShell):
#   $env:DB_USERNAME = "root"
#   $env:DB_PASSWORD = "yourpassword"
#
# createDatabaseIfNotExist=true will auto-create
# the authentication_db database if it does not exist.
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/authentication_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA / Hibernate
# ddl-auto=update: Hibernate creates or updates
# tables automatically. Switch to 'validate' in
# production after schema is stable.
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────
# JWT
# Secret is read from JWT_SECRET environment variable.
# For production: use a strong random 32+ character secret.
# Expiration: 86400000 ms = 24 hours
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.auth.app=INFO
